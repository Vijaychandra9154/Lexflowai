services:
  - type: web
    name: lexflowai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexflowai-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
    autoDeploy: true
    healthCheckPath: /api/health

databases:
  - name: lexflowai-db
    plan: free
    databaseName: lexflowai
    user: lexflowai
